[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dexcodesign"
version = "0.1.0"
description = "Grammar-constrained dexterous-hand morphology compiler"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.5.1",
  "scipy==1.18.0",
  "trimesh==4.12.2",
  "shapely==2.1.2",
  "mujoco==3.3.7",
  "pillow==12.3.0",
  "rtree==1.4.1",
  "pycollada==0.9.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dexcodesign*"]
