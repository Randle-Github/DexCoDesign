[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dexcodesign"
version = "0.1.0"
description = "Grammar-constrained dexterous-hand morphology compiler"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2",
  "scipy>=1.11,<2",
  "trimesh>=4,<5",
  "mapbox-earcut>=2,<3",
  "shapely>=2,<3",
  "mujoco>=3,<4",
  "pillow>=10,<13",
  "rtree>=1,<2",
  "pycollada>=0.8,<1",
]

[project.optional-dependencies]
test = ["pytest>=7,<9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dexcodesign*"]
