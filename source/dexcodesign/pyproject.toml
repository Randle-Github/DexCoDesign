[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dexcodesign"
version = "0.1.0"
description = "Grammar-constrained dexterous-hand morphology compiler"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["dexcodesign*"]
