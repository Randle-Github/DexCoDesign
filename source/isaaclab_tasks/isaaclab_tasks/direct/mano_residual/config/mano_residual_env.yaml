# Environment-level collision choices for the MANO residual task.
collisions:
  # true:  disable physical contacts between the hand and support/table
  # false: enable physical contacts between the hand and support/table
  # Hand-object and object-support collisions remain enabled in both cases.
  disable_hand_support_collisions: False

# false: object pose is the original rigid [xyz, quaternion_wxyz] vector.
# true:  object pose appends all articulated-object joint positions. Nothing
# else about the hand, action, controller, or PPO configuration changes.
articulate_mode: false

# Adds the opposite MANO hand as a physical reference-tracking support hand.
# The residual PPO action continues to control the selected primary side, so
# existing single-hand action semantics and checkpoints remain unchanged.
bimanual_mode: false

# Maximum residual correction produced by a normalized policy action in
# [-1, 1]. Position is in meters; rotation and finger joints are in radians.
residual_actions:
  root_position_scale: 0.10
  root_rotation_scale: 0.30
  finger_scale: 0.30
