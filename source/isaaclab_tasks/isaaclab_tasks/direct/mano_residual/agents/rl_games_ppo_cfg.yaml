params:
  seed: 42

  env:
    clip_observations: 5.0
    clip_actions: 1.0

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    # Match the independent actor and critic in skrl_ppo_cfg.yaml.
    separate: True
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          # Match SKRL's initial_log_std: -2.0.
          val: -2.0
        fixed_sigma: True
    mlp:
      units: [256, 128]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: False
  load_path: ''

  config:
    name: mano_residual
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    value_bootstrap: False
    num_actors: -1
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 3.0e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.01
    score_to_win: 100000
    # At 256 environments and horizon 16, this is 4,915,200 transitions.
    max_epochs: 1200
    save_best_after: 10
    save_frequency: 25
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.001
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 16
    # 256 environments x 16 steps / 4 minibatches.
    minibatch_size: 1024
    mini_epochs: 5
    critic_coef: 1.0
    clip_value: True
    seq_length: 4
    bounds_loss_coef: 0.0001

    player:
      deterministic: True
      games_num: 100000
      print_stats: True
